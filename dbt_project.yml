config-version: 2

name: "tag_masking_dbt"
version: "3.0.0"
require-dbt-version: ">=1.12.0"

dbt-cloud:
  project-id: 275557 # Put your project id here

profile: "tag_masking_dbt" # Matches the profile name in ~/.dbt/profiles.yml or project profile.yml

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["data-tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  tag_masking_dbt:
    +schema: raw
    jaffle-data:
      +enabled: true

models:
  tag_masking_dbt:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

flags:
  require_generic_test_arguments_property: true