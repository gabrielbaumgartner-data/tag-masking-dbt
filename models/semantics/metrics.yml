metrics:
  - name: semantic_orders
    description: Count of customer orders.
    label: Semantic Layer Orders
    type: simple
    type_params:
      measure: order_count

  - name: semantic_order_total
    description: Total order amount including tax.
    label: Semantic Layer Order Total
    type: simple
    type_params:
      measure: order_total_amount

  - name: semantic_revenue
    description: Revenue from order items, excluding tax.
    label: Semantic Layer Revenue
    type: simple
    type_params:
      measure: item_revenue

  - name: semantic_food_revenue
    description: Revenue generated by food items.
    label: Semantic Layer Food Revenue
    type: simple
    type_params:
      measure: food_item_revenue

  - name: semantic_food_revenue_pct
    description: Percentage of item revenue generated by food.
    label: Semantic Layer Food Revenue %
    type: ratio
    type_params:
      numerator: semantic_food_revenue
      denominator: semantic_revenue

  - name: semantic_customers
    description: Count of unique customers.
    label: Semantic Layer Customers
    type: simple
    type_params:
      measure: customer_count

  - name: semantic_average_order_value
    description: Customer lifetime spend before tax divided by order count.
    label: Semantic Layer Average Order Value
    type: derived
    type_params:
      expr: customer_lifetime_spend_pretax / customer_lifetime_orders
      metrics:
        - name: semantic_customer_lifetime_spend_pretax
          alias: customer_lifetime_spend_pretax
        - name: semantic_customer_lifetime_orders
          alias: customer_lifetime_orders

  - name: semantic_customer_lifetime_orders
    description: Total number of orders placed by customers.
    label: Semantic Layer Lifetime Orders
    type: simple
    type_params:
      measure: lifetime_order_count

  - name: semantic_customer_lifetime_spend_pretax
    description: Customer lifetime spend before tax.
    label: Semantic Layer LTV Pre-tax
    type: simple
    type_params:
      measure: lifetime_spend_pretax_amount