semantic_models:
  - name: orders_semantic
    description: One row per customer order.
    model: ref('orders')
    defaults:
      agg_time_dimension: ordered_at
    entities:
      - name: sl_order
        type: primary
        expr: order_id
      - name: sl_customer
        type: foreign
        expr: customer_id
      - name: sl_location
        type: foreign
        expr: location_id
    dimensions:
      - name: ordered_at
        type: time
        type_params:
          time_granularity: day
      - name: order_total
        type: categorical
      - name: is_food_order
        type: categorical
      - name: is_drink_order
        type: categorical
      - name: customer_order_number
        type: categorical
    measures:
      - name: order_count
        description: Number of orders.
        agg: count
        expr: order_id
      - name: order_total_amount
        description: Total order amount including tax.
        agg: sum
        expr: order_total
      - name: tax_paid_amount
        description: Total tax paid on orders.
        agg: sum
        expr: tax_paid
      - name: order_cost_amount
        description: Total supply cost required to fulfill orders.
        agg: sum
        expr: order_cost

  - name: order_items_semantic
    description: One row per item included in an order.
    model: ref('order_items')
    defaults:
      agg_time_dimension: ordered_at
    entities:
      - name: sl_order_item
        type: primary
        expr: order_item_id
      - name: sl_order
        type: foreign
        expr: order_id
      - name: sl_product
        type: foreign
        expr: product_id
    dimensions:
      - name: ordered_at
        type: time
        type_params:
          time_granularity: day
      - name: is_food_item
        type: categorical
      - name: is_drink_item
        type: categorical
    measures:
      - name: item_revenue
        description: Revenue generated by order items, excluding tax.
        agg: sum
        expr: product_price
      - name: food_item_revenue
        description: Revenue generated by food items.
        agg: sum
        expr: case when is_food_item then product_price else 0 end
      - name: drink_item_revenue
        description: Revenue generated by drink items.
        agg: sum
        expr: case when is_drink_item then product_price else 0 end
      - name: median_item_revenue
        description: Median revenue per order item, excluding tax.
        agg: median
        expr: product_price

  - name: customers_semantic
    description: One row per customer.
    model: ref('customers')
    defaults:
      agg_time_dimension: first_ordered_at
    entities:
      - name: sl_customer
        type: primary
        expr: customer_id
    dimensions:
      - name: customer_name
        type: categorical
      - name: cpf
        type: categorical
      - name: customer_type
        type: categorical
      - name: first_ordered_at
        type: time
        type_params:
          time_granularity: day
      - name: last_ordered_at
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: customer_count
        description: Number of unique customers.
        agg: count_distinct
        expr: customer_id
      - name: lifetime_order_count
        description: Total number of orders placed by customers.
        agg: sum
        expr: count_lifetime_orders
      - name: lifetime_spend_pretax_amount
        description: Customer lifetime spend before tax.
        agg: sum
        expr: lifetime_spend_pretax
      - name: lifetime_spend_amount
        description: Customer lifetime spend including tax.
        agg: sum
        expr: lifetime_spend

  - name: products_semantic
    description: One row per product.
    model: ref('products')
    entities:
      - name: sl_product
        type: primary
        expr: product_id
    dimensions:
      - name: product_name
        type: categorical
      - name: product_type
        type: categorical
      - name: product_description
        type: categorical
      - name: is_food_item
        type: categorical
      - name: is_drink_item
        type: categorical
      - name: product_price
        type: categorical

  - name: locations_semantic
    description: One row per store location.
    model: ref('locations')
    defaults:
      agg_time_dimension: opened_date
    entities:
      - name: sl_location
        type: primary
        expr: location_id
    dimensions:
      - name: location_name
        type: categorical
      - name: opened_date
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: average_tax_rate_value
        description: Average tax rate across locations.
        agg: average
        expr: tax_rate

  - name: supplies_semantic
    description: One row per supply and product combination.
    model: ref('supplies')
    entities:
      - name: sl_supply
        type: primary
        expr: supply_uuid
      - name: sl_product
        type: foreign
        expr: product_id
    dimensions:
      - name: supply_id
        type: categorical
      - name: supply_name
        type: categorical
      - name: supply_cost
        type: categorical
      - name: is_perishable_supply
        type: categorical